name: Declared dependency minimums
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate complete coverage and companion constraints
        run: python -m unittest discover -s .opencode/tests -p test_dependency_minimums.py
      - id: matrix
        run: echo "cases=$(python .opencode/workflows/dependency_minimums.py)" >> "$GITHUB_OUTPUT"
  minimum:
    needs: matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cases) }}
    name: R 4.1 / ${{ matrix.package }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true
      - name: Install units system dependency
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev
      - name: Prepare isolated case and artifact directories
        env:
          FLOOR_PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/floor-library" "$GITHUB_WORKSPACE/.opencode/results/dependency-minimums/$FLOOR_PACKAGE"
          python .opencode/workflows/dependency_minimums.py --case "$FLOOR_PACKAGE" > "$RUNNER_TEMP/floor-case.json"
          cp "$RUNNER_TEMP/floor-case.json" "$GITHUB_WORKSPACE/.opencode/results/dependency-minimums/$FLOOR_PACKAGE/case.json"
          echo "STATART_FLOOR_LIBRARY=$RUNNER_TEMP/floor-library" >> "$GITHUB_ENV"
          echo "STATART_FLOOR_RESULTS=$GITHUB_WORKSPACE/.opencode/results/dependency-minimums/$FLOOR_PACKAGE" >> "$GITHUB_ENV"
      - name: Install checking tools and deliberately limited optional dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rcmdcheck", "jsonlite", "knitr",
            "rmarkdown", "withr", "bit64", "data.table"), dependencies = NA)
      - name: Validate checking-session constraint and completion auditing
        run: Rscript .opencode/tests/test_dependency_minimums.R
      - name: Install exact boundary with reviewed companions
        run: Rscript .opencode/workflows/dependency_minimums.R install "$RUNNER_TEMP/floor-case.json"
      - name: Check and record actual checking-session versions and skips
        run: Rscript .opencode/workflows/dependency_minimums.R check "$RUNNER_TEMP/floor-case.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-minimum-${{ matrix.package }}
          path: .opencode/results/dependency-minimums/${{ matrix.package }}
