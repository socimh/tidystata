on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R style

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::remotes, any::rcmdcheck, any::pkgload, local::.
      - name: Install pinned style tools
        run: |
          python -m pip install air-formatter==0.12.0
          Rscript -e 'remotes::install_version("lintr", version = "3.4.0", upgrade = "never")'
      - name: Check adopted sources and pull-request additions
        env:
          STYLE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$STYLE_BASE" ]; then
            python .opencode/workflows/check_style.py --base "$STYLE_BASE"
          else
            python .opencode/workflows/check_style.py
          fi
      - name: Check verification, identity and dependency-bound regressions
        run: python -m unittest discover -s .opencode/tests -p 'test_*.py'
