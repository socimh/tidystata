# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the built website to GitHub Pages'
        required: true
        default: false
        type: boolean

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Keep deployments serialized; replace outdated previews for each PR.
    concurrency:
      group: pkgdown-${{ github.event.pull_request.number || 'deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: '2'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install current source
        run: R CMD INSTALL --preclean .

      - name: Build site
        run: |
          source("pkgdown/build-stata-reference.R")
          testthat::test_file("pkgdown/tests/test-stata-reference.R", stop_on_failure = TRUE)
          build_stata_reference(".")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
          finalize_stata_reference(".", "docs")
          check_stata_reference(".", "docs")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
