name: Documentation freshness
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::remotes, any::decor, roxygen2@8.0.0
          needs: website
      - name: Install current source and regenerate documentation
        shell: Rscript {0}
        run: |
          lib <- tempfile("tidystata-doc-library-")
          dir.create(lib)
          remotes::install_local(".", lib = lib, upgrade = "never", build_vignettes = FALSE)
          .libPaths(c(lib, .libPaths()))
          roxygen2::roxygenise()
          options(crayon.enabled = FALSE, cli.num_colors = 1L, width = 80L)
          Sys.setenv(LC_ALL = "C", LANG = "C", TZ = "UTC", COLUMNS = "80",
                     R_CLI_NUM_COLORS = "0", NO_COLOR = "1")
          Sys.setlocale("LC_ALL", "C")
          for (readme in c("README.Rmd", "README.zh.Rmd")) {
            rmarkdown::render(readme, quiet = TRUE, encoding = "UTF-8",
                              envir = new.env(parent = globalenv()))
          }
      - name: Fail on stale help, namespace or README
        run: |
          git status --porcelain --untracked-files=all -- man NAMESPACE README.md README.zh.md
          test -z "$(git status --porcelain --untracked-files=all -- man NAMESPACE README.md README.zh.md)"
      - name: Record README rendering differences
        if: always()
        run: git diff -- README.md README.zh.md > readme-render.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-render-diff
          path: readme-render.diff
