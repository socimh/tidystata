url: https://socimh.github.io/tidystata/
template:
  bootstrap: 5
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1.0625rem
    line-height-base: 1.7
    headings-line-height: 1.3
    headings-font-weight: 600
    headings-margin-bottom: 0.75rem
    paragraph-margin-bottom: 1.25rem
    code-font-size: 0.875em

navbar:
  structure:
    left: [intro, reference, stata_to_r, articles, tutorials, news]
    right: [search, github, lightswitch]
  components:
    stata_to_r:
      text: "Stata → R"
      href: https://www.socimh.com/stata-to-r/

articles:
- title: "Learn tidystata"
  navbar: ~
  contents:
  - getting-started
  - containers-and-missing-values
  - articles/coming-from-stata
  - articles/coming-from-stata-zh
- title: internal
  contents:
  - articles/migration

reference:
- title: "Coming from Stata"
  contents:
  - findit
- title: "Inspect variables"
  contents:
  - has_concept("inspection functions")
- title: "Tabulate"
  contents:
  - has_concept("tabulation functions")
- title: "Summarise"
  contents:
  - has_concept("summary functions")
- title: "Check and combine data"
  contents:
  - has_concept("data checking functions")
- title: "Generate variables"
  contents:
  - has_concept("variable generation functions")
- title: "Convert types"
  contents:
  - has_concept("conversion functions")
- title: "Select and preview"
  contents:
  - has_concept("selection and preview functions")
- title: "Small tools"
  contents:
  - has_concept("utility functions")
  - "%>%"
- title: "Sample Data"
  contents:
  - lifeexp
