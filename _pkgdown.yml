url: https://socimh.github.io/tidystata/
template:
  bootstrap: 5
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1.0625rem
    line-height-base: 1.7
    headings-line-height: 1.3
    headings-font-weight: 600
    headings-margin-bottom: 0.75rem
    paragraph-margin-bottom: 1.25rem
    code-font-size: 0.875em

navbar:
  structure:
    left: [intro, reference, stata_to_r, articles, tutorials, news]
    right: [search, github, lightswitch]
  components:
    stata_to_r:
      text: "Stata to R"
      href: articles/coming-from-stata.html
    articles:
      text: Articles
      menu:
      - text: "Getting started with tidystata"
        href: articles/getting-started.html
      - text: "Inspect and prepare data"
        href: articles/inspect-and-prepare.html
      - text: "Tabulate and compare categories"
        href: articles/tabulation.html
      - text: "Summarise measurements"
        href: articles/summary-statistics.html
      - text: "Containers, grouping and missing values"
        href: articles/containers-and-missing-values.html

articles:
- title: "Learn tidystata"
  contents:
  - getting-started
  - inspect-and-prepare
  - tabulation
  - summary-statistics
  - containers-and-missing-values
- title: internal
  contents:
  - articles/coming-from-stata
  - articles/coming-from-stata-zh
  - articles/migration
  - starts_with("articles/stata-")

reference:
- title: "Coming from Stata"
  contents:
  - findit
- title: "Inspect variables"
  contents:
  - codebook
  - browse
  - misstable
  - var_type
  - names
  - variables
- title: "Select columns"
  contents:
  - select_or_transmute
  - varlist
- title: "Convert types"
  contents:
  - type_conversion
  - na_conversion
- title: "Check and combine data"
  contents:
  - keys
  - assert
  - is_first
  - stata_merge
- title: "Create and transform variables"
  contents:
  - stata_recode
  - cut_quantile
  - as_dummy
  - std
  - row_egen
- title: "Panel operations"
  contents:
  - panel
- title: "Tabulate and summarise"
  contents:
  - tab
  - summ
- title: "Correlations"
  contents:
  - corr
- title: "Preview tables"
  contents:
  - preview
  - print_headtail
- title: "Workflow utilities"
  contents:
  - set_seed
  - capture
  - timer
  - "%>%"
- title: "Sample data"
  contents:
  - lifeexp
