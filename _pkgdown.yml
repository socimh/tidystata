url: https://socimh.github.io/statart/
template:
  bootstrap: 5

reference:
- title: "Explore Data"
  contents:
  - browse
  - names
  - variables
  - codebook
  - summ
  - matches("^(tab|fre)")
  - matches("^row_")
- title: "Type Conversion"
  contents:
  - na_conversion
  - type_conversion
- title: "Small Tools"
  contents:
  - cut
  - starts_with("s_")
  - set_seed
  - timer
  - pipe
- title: "Sample Data"
  contents:
  - lifeexp
  - starwars
